name: DSM-01 bit-exact MASH
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pll-dsm01.yml'
      - 'pll/labs/DSM-01/**'
      - 'pll/course/coupled-loop.js'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compare registered RTL outputs to the reference
        run: |
          set -o pipefail
          lab=pll/labs/DSM-01
          for width in 4 12 24; do
            python "$lab/check_mash.py" "$width" "$RUNNER_TEMP/vectors-$width.txt"
            iverilog -g2012 -s mash111_tb -P "mash111_tb.WIDTH=$width" \
              -o "$RUNNER_TEMP/mash-$width.vvp" "$lab/mash111.sv" "$lab/mash111_tb.sv"
            vvp "$RUNNER_TEMP/mash-$width.vvp" "+vectors=$RUNNER_TEMP/vectors-$width.txt"
          done | tee "$RUNNER_TEMP/dsm-check.log"
      - name: Compare one-, two- and three-stage spectra with dither
        run: |
          python -m pip install numpy==2.3.5
          python pll/labs/DSM-01/measure_mash.py "$RUNNER_TEMP/dsm-spectrum"
          python pll/labs/DSM-01/measure_mash.py "$RUNNER_TEMP/dsm-spectrum-custom" --num 1001 --den 4096 --seed 0x1234 --amplitude 3
      - name: Compare average divider and integer feedback edges
        run: |
          node pll/labs/PLL-SPICE/check_loop01_pfd.mjs
          python pll/labs/DSM-01/compare_fractional.py "$RUNNER_TEMP/fractional"
          python pll/labs/DSM-01/compare_fractional.py "$RUNNER_TEMP/fractional-custom" --num 1001 --den 4096 --seed 0x1234
      - name: Execute the Fractional-N notebook
        working-directory: pll/labs/DSM-01
        run: |
          python -m pip install nbconvert==7.16.6 ipykernel==6.30.1
          jupyter nbconvert --to notebook --execute FractionalN_Closed_Loop.ipynb \
            --output-dir="$RUNNER_TEMP" --output=FractionalN_Closed_Loop.executed.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: dsm01-check
          path: |
            ${{ runner.temp }}/dsm-check.log
            ${{ runner.temp }}/dsm-spectrum/
            ${{ runner.temp }}/dsm-spectrum-custom/
            ${{ runner.temp }}/fractional/
            ${{ runner.temp }}/fractional-custom/
            ${{ runner.temp }}/FractionalN_Closed_Loop.executed.ipynb
