name: PLL course Chromium regression
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pll-course-browser.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check offline desktop and mobile course reloads
        run: |
          set -o pipefail
          npm install --prefix "$RUNNER_TEMP" --no-audit --no-fund playwright@1.56.1
          cat > "$RUNNER_TEMP/pll-browser.mjs" <<'EOF'
          import {readdir,readFile} from 'node:fs/promises';
          import {pathToFileURL} from 'node:url';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({channel:'chrome',headless:true,timeout:20000});
          const page=await browser.newPage();
          const client=await page.context().newCDPSession(page);
          const send=(method,params={})=>client.send(method,params);
          let loaded, errors=[], failed=0;
          client.on('Page.loadEventFired',()=>loaded?.());
          client.on('Runtime.exceptionThrown',event=>errors.push(event.exceptionDetails.exception?.description));
          client.on('Network.responseReceived',event=>{
            if(event.response.status>=400 && !event.response.url.endsWith('/favicon.ico')) errors.push({status:event.response.status,url:event.response.url});
          });
          const evaluate=async fn=>(await send('Runtime.evaluate',{expression:'('+fn+')()',awaitPromise:true,returnByValue:true})).result.value;
          async function load(method,params){
            let timer;
            const done=new Promise((ok,fail)=>{loaded=ok;timer=setTimeout(()=>fail(new Error('load timeout')),7000);});
            try {await send(method,params);await done;} finally {clearTimeout(timer);loaded=null;}
          }
          await send('Page.enable');await send('Runtime.enable');await send('Network.enable');
          await send('Network.setCacheDisabled',{cacheDisabled:true});
          const mode=process.env.PLL_BROWSER_MODE || 'offline';
          if(mode==='offline') await send('Network.setBlockedURLs',{urls:['https://*','http://*','ws://*','wss://*']});
          const course=(await readdir('pll/course')).filter(x=>/^(?:[a-f]\d|app)-\d+\.html$/.test(x));
          if(course.length!==52) throw new Error('Expected 52 course pages, got '+course.length);
          for(const [width,height] of [[1440,900],[390,844]]){
           await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile:width===390});
           for(const name of course){
            errors=[];
            const url=mode==='online'
              ? 'https://thecloud723.github.io/analog-ic-learning/pll/course/'+name
              : pathToFileURL(process.cwd()+'/pll/course/'+name).href;
            await load('Page.navigate',{url});
            await load('Page.reload',{ignoreCache:true});
            if(mode==='online') await new Promise(resolve=>setTimeout(resolve,200));
            const result=await evaluate(async()=>{
             const controls=[...document.querySelectorAll('.lab :is(input[type=range],select,input[type=checkbox],input[type=radio]:not(:checked)):not(:disabled)')];
             const snapshots=lab=>JSON.stringify([lab.innerHTML,...[...lab.querySelectorAll('output')].map(x=>x.value),...[...lab.querySelectorAll('canvas')].map(x=>x.toDataURL())]);
             let changed=0;
             for(const input of controls){
              const lab=input.closest('.lab'), before=snapshots(lab), original=input.value;
              const originalChecked=input.checked;
              const previousRadio=input.type==='radio'
                ? lab.querySelector('input[name="'+CSS.escape(input.name)+'"]:checked') : null;
              if(input.type==='select-one') {
               const alternative=[...input.options].find(option=>!option.disabled && option.value!==original);
               if(alternative) input.value=alternative.value;
              } else if(input.type==='checkbox' || input.type==='radio') input.checked=!originalChecked;
              else input.value=input.value===input.max?input.min:input.max;
              input.dispatchEvent(new Event('input',{bubbles:true}));
              input.dispatchEvent(new Event('change',{bubbles:true}));
              await new Promise(requestAnimationFrame);
              changed+=Number(snapshots(lab)!==before);
              if(input.type==='radio' && previousRadio) previousRadio.checked=true;
              else if(input.type==='checkbox' || input.type==='radio') input.checked=originalChecked;
              else input.value=original;
              const restored=previousRadio || input;
              restored.dispatchEvent(new Event('input',{bubbles:true}));
              restored.dispatchEvent(new Event('change',{bubbles:true}));
             }
             const boundaryErrors=[];
             let boundaryChecks=0;
             for(const input of controls.filter(control=>control.type==='range')){
              const original=input.value;
              const lab=input.closest('.lab');
              for(const value of [input.min,input.max]){
               input.value=value;
               input.dispatchEvent(new Event('input',{bubbles:true}));
               input.dispatchEvent(new Event('change',{bubbles:true}));
               boundaryChecks++;
               const outputs=[...lab.querySelectorAll('output, [data-result], #c-lab-result, #d-result, #e-result, [role=status]')];
               const invalid=outputs.some(node=>/\b(?:NaN|Infinity|undefined)\b/.test(node.textContent));
               if(Number(input.value)!==Number(value) || invalid) boundaryErrors.push(input.id+'='+value);
              }
              input.value=original;
              input.dispatchEvent(new Event('input',{bubbles:true}));
              input.dispatchEvent(new Event('change',{bubbles:true}));
             }
             return {boundaryChecks,boundaryErrors,heading:!!document.querySelector('main h1'),nav:document.querySelectorAll('nav a[aria-current=page]').length,
              overflow:document.documentElement.scrollWidth-innerWidth,
              badImages:[...document.images].filter(i=>!i.naturalWidth && i.loading!=='lazy').map(i=>i.src),
              changed,controls:controls.length};
            });
            const physical = await evaluate(()=>{
             const lab=document.querySelector('.lab');
             if(!lab) return [];
             const checks=[];
             const output=()=>lab.querySelector('[data-result], #c-lab-result, #d-result, #e-result')?.textContent || '';
             const change=(id,value)=>{
              const input=document.getElementById(id);
              if(typeof value==='boolean') input.checked=value;
              else input.value=String(value);
              input.dispatchEvent(new Event('input',{bubbles:true}));
              input.dispatchEvent(new Event('change',{bubbles:true}));
             };
             const check=(label,expected)=>checks.push({label,actual:output(),pass:expected.test(output())});
             switch(lab.dataset.lab){
              case 'ratio':
               change('n',100);check('N=100',/4\.00 GHz.*40 MHz/);
               change('n',150);check('N=150',/6\.00 GHz.*40 MHz/);break;
              case 'delay':
               for(const [v,expected] of [[-2500,/-90\.00°/],[0,/ 0\.00°/],[2500,/\+90\.00°/]]){
                change('delay',v);check('delay='+v,expected);
               }break;
              case 'ramp':
               for(const [v,expected] of [[-5,/-4\.85 圈/],[0,/\+0\.15 圈/],[5,/\+5\.15 圈/]]){
                change('df',v);check('offset='+v,expected);
               }break;
              case 'edge': {
               check('reference leads',/^UP .*加速/);
               const feedback=lab.querySelector('input[value="fb"]');
               feedback.click();check('feedback leads',/^DN .*减速/);break;
              }
              case 'divider': {
               const input=document.getElementById('out-div');
               for(const option of input.options){
                change(input.id,option.value);
                const match=output().match(/降低 ([\d.]+) dB.*前 ([\d.]+) ps.*后 ([\d.]+) ps/);
                const pass=!!match && Math.abs(Number(match[1])-20*Math.log10(Number(option.value)))<0.006 &&
                  Number(match[2])>0 && match[2]===match[3];
                checks.push({label:'divider='+option.value,actual:output(),pass});
               }break;
              }
              case 'settle':
               change('offset',-200);check('negative initial offset',/-2\.00 mV/);
               change('offset',0);check('zero initial offset',/ 0\.00 mV/);
               change('offset',200);check('positive initial offset',/\+2\.00 mV/);break;
              case 'crystal':
               change('cl',5);check('5 pF',/\+357\.1 ppm/);
               change('cl',20);check('20 pF',/\+113\.6 ppm/);break;
              case 'plan':
               change('ref-r',1);change('plan-n',70);check('R=1 N=70',/200\.00 MHz.*14\.000 GHz/);
               change('ref-r',2);check('R=2 N=70',/100\.00 MHz.*7\.000 GHz.*140/);
               change('plan-n',140);check('R=2 N=140',/100\.00 MHz.*14\.000 GHz/);break;
              case 'startup':
               change('series-loss',2.2);check('low loss',/稳态 5\.429 GHz.*0\.461 V/);
               change('series-loss',18);check('high loss',/未形成稳态频率.*0\.000 V/);break;
              case 'capSweep':
               change('vco-cap',680);check('680 fF',/SPICE 5\.905 GHz/);
               change('vco-cap',970);check('970 fF',/SPICE 4\.976 GHz/);break;
              case 'rc': {
               for(const [p,z,v] of [[0,'1000.8','20.02'],[20,'193.7','3.87']]){
                change('parallel-cap',p);
                checks.push({label:'Cp='+p,actual:output(),pass:output().includes(z+' Ω') && output().includes(v+' mVpp')});
               }break;
              }
              case 'ts':
               for(const v of [0.3,0.7,0.9]){
                change('ts-damping',v);check('damping='+v,/1\.0000 \+ j-?0\.0000/);
               }break;
              case 'ssb': {
               const noise=()=>Number(output().match(/噪声约 (-?[\d.]+) dBc/)[1]);
               change('rbw',10);const small=noise();
               change('rbw',1000);
               checks.push({label:'100× RBW',actual:output(),pass:Math.abs(noise()-small-20)<0.11 && output().includes('−88 dBc')});
               change('random',false);check('noise off',/随机噪声关闭.*单音 −88 dBc/);
               change('tone',false);check('tone off',/随机噪声关闭.*单音关闭/);break;
              }
              case 'spurLoc':
               change('pfd-spur',0.5);check('PFD .5 MHz',/2099\.50 \/ 2100\.50 MHz/);
               change('pfd-spur',1.25);check('PFD 1.25 MHz',/2098\.75 \/ 2101\.25 MHz/);break;
              case 'cpSpur':
               change('d-cp-m',0);check('matched CP',/无可辨纹波边带/);
               change('d-cp-m',5);check('5% mismatch',/基波峰值 [\d.]+ mV.*数值投影 -[\d.]+ dBc/);break;
              case 'pattern':
               change('pattern-num',4);check('NUM=4',/4 拍.*2\.500 MHz/);
               change('pattern-num',5);check('NUM=5',/16 拍.*0\.625 MHz/);
               change('pattern-num',0);check('NUM=0',/1 拍.*10\.000 MHz/);break;
              case 'tdc':
               change('tdc-lsb',5);
               change('tdc-in',0);check('zero',/码 0.*回读 0 ps.*误差 0 ps/);
               change('tdc-in',37);check('quantized',/码 7.*回读 35 ps.*误差 -2 ps/);
               change('tdc-in',100);check('overflow',/码 15.*回读 75 ps.*已超量程/);break;
              case 'calibrate':
               change('dco-target',-70);check('low clip',/选码 0（限幅）/);
               change('dco-target',200);check('high clip',/选码 63（限幅）/);break;
              case 'fractional':
               change('frac-num',0);check('NUM=0',/周期 1 拍.*240\.0000.*2\.400000 GHz/);
               change('frac-num',15);check('NUM=15',/周期 16 拍.*240\.9375.*2\.409375 GHz/);break;
             }
             return checks;
            });
            if(physical.length) result.physical=physical;
            if(physical.some(check=>!check.pass)) failed++;
            if(name==='app-2.html'){
             const [download]=await Promise.all([page.waitForEvent('download',{timeout:5000}),page.locator('#f-export').click({timeout:5000})]);
             const csv=await readFile(await download.path(),'utf8');
             const [header,...lines]=csv.trimEnd().split('\n');
             result.csvValid=header==='time_s,vctrl_v' && lines.length===500 &&
               lines.every((line,i)=>{const fields=line.split(','); return fields.length===2 &&
                 fields.every(x=>x!=='' && Number.isFinite(Number(x))) &&
                 Math.abs(Number(fields[0])-i*2e-9)<1e-15;});
             if(!result.csvValid) failed++;
            }
            console.log(JSON.stringify({width,name,...result,errors}));
            if(!result.heading || result.nav!==1 || result.overflow>1 || result.badImages.length || result.changed!==result.controls || result.boundaryErrors.length || errors.length) failed++;
           }
          }
          if(mode==='offline') for(const name of (await readdir('pll/chapters')).filter(x=>x.endsWith('.html'))){
           const html=await readFile('pll/chapters/'+name,'utf8');
           const ids=[...html.matchAll(/<(?:section|article|div)\b[^>]*\bid="(p[1-8])"/g)].map(m=>m[1]);
           const fragment=name.startsWith('01_')?'quiz':'p8';
           if(fragment==='p8' && !ids.includes(fragment)) throw new Error('Missing legacy fragment: '+name);
           errors=[];
           const url=pathToFileURL(process.cwd()+'/pll/chapters/'+name).href+'#'+fragment;
           await load('Page.navigate',{url});
           await load('Page.reload',{ignoreCache:true});
           const visible=await evaluate(()=>!!document.getElementById(location.hash.slice(1))?.getClientRects().length);
           console.log(JSON.stringify({legacy:name,fragment,visible,errors}));
           if(!visible || errors.length) failed++;
           const frequencyLink=name.startsWith('05_')?'p7':name.startsWith('PLL_第18')?'p2':null;
           if(frequencyLink){
            await load('Page.navigate',{url:'about:blank'});
            await load('Page.navigate',{url:url.split('#')[0]+'#'+frequencyLink});
            await load('Page.reload',{ignoreCache:true});
            const result=await evaluate(()=>{
             const get=id=>document.getElementById(id);
             const change=(id,value)=>{
              get(id).value=value;
              get(id).dispatchEvent(new Event('input',{bubbles:true}));
              get(id).dispatchEvent(new Event('change',{bubbles:true}));
             };
             if(location.hash==='#p7'){
              change('r5',2);change('n5',32);change('d5',4);
              return {visible:!!get('p7').getClientRects().length,values:['f5pd','f5vco','f5clk'].map(id=>get(id).textContent)};
             }
             change('ref18',100);change('ratio18',40.25);change('post18',2);
             return {visible:!!get('p2').getClientRects().length,values:['vco18','out18','alpha18'].map(id=>get(id).textContent)};
            });
            const expected=frequencyLink==='p7'?['50.00 MHz','1.6000 GHz','400.00 MHz']:['4.0250 GHz','2.0125 GHz','0.25'];
            const pass=result.visible && result.values.every((value,i)=>value===expected[i]) && !errors.length;
            console.log(JSON.stringify({legacyFrequency:name,fragment:frequencyLink,...result,pass}));
            if(!pass) failed++;
           }
          }
          await browser.close();
          if(failed) process.exitCode=1;
          EOF
          node "$RUNNER_TEMP/pll-browser.mjs" | tee "$RUNNER_TEMP/pll-browser-results.jsonl"
      - name: Check published course reloads
        if: always()
        run: |
          set -o pipefail
          PLL_BROWSER_MODE=online node "$RUNNER_TEMP/pll-browser.mjs" | tee "$RUNNER_TEMP/pll-browser-online.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pll-browser-regression
          path: |
            ${{ runner.temp }}/pll-browser-results.jsonl
            ${{ runner.temp }}/pll-browser-online.jsonl
