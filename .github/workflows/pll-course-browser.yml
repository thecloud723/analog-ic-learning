name: PLL course Chromium regression
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pll-course-browser.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check offline desktop and mobile course reloads
        run: |
          set -o pipefail
          npm install --prefix "$RUNNER_TEMP" --no-audit --no-fund playwright@1.56.1
          cat > "$RUNNER_TEMP/pll-browser.mjs" <<'EOF'
          import {readdir,readFile} from 'node:fs/promises';
          import {pathToFileURL} from 'node:url';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({channel:'chrome',headless:true,timeout:20000});
          const page=await browser.newPage();
          const client=await page.context().newCDPSession(page);
          const send=(method,params={})=>client.send(method,params);
          let loaded, errors=[], failed=0;
          client.on('Page.loadEventFired',()=>loaded?.());
          client.on('Runtime.exceptionThrown',event=>errors.push(event.exceptionDetails.exception?.description));
          client.on('Network.responseReceived',event=>{
            if(event.response.status>=400 && !event.response.url.endsWith('/favicon.ico')) errors.push(event.response.url);
          });
          const evaluate=async fn=>(await send('Runtime.evaluate',{expression:'('+fn+')()',awaitPromise:true,returnByValue:true})).result.value;
          async function load(method,params){
            let timer;
            const done=new Promise((ok,fail)=>{loaded=ok;timer=setTimeout(()=>fail(new Error('load timeout')),7000);});
            try {await send(method,params);await done;} finally {clearTimeout(timer);loaded=null;}
          }
          await send('Page.enable');await send('Runtime.enable');await send('Network.enable');
          await send('Network.setCacheDisabled',{cacheDisabled:true});
          await send('Network.setBlockedURLs',{urls:['https://*','http://*','ws://*','wss://*']});
          const course=(await readdir('pll/course')).filter(x=>/^(?:[a-f]\d|app)-\d+\.html$/.test(x));
          if(course.length!==52) throw new Error('Expected 52 course pages, got '+course.length);
          for(const [width,height] of [[1440,900],[390,844]]){
           await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile:width===390});
           for(const name of course){
            errors=[];
            const url=pathToFileURL(process.cwd()+'/pll/course/'+name).href;
            await load('Page.navigate',{url});
            await load('Page.reload',{ignoreCache:true});
            const result=await evaluate(async()=>{
             const controls=[...document.querySelectorAll('.lab input[type=range]:not(:disabled)')];
             const snapshots=lab=>JSON.stringify([lab.innerHTML,...[...lab.querySelectorAll('output')].map(x=>x.value)]);
             let changed=0;
             for(const input of controls){
              const lab=input.closest('.lab'), before=snapshots(lab), original=input.value;
              input.value=input.value===input.max?input.min:input.max;
              input.dispatchEvent(new Event('input',{bubbles:true}));
              await new Promise(requestAnimationFrame);
              changed+=Number(snapshots(lab)!==before);
              input.value=original;
              input.dispatchEvent(new Event('input',{bubbles:true}));
             }
             return {heading:!!document.querySelector('main h1'),nav:document.querySelectorAll('nav a[aria-current=page]').length,
              overflow:document.documentElement.scrollWidth-innerWidth,
              badImages:[...document.images].filter(i=>!i.naturalWidth && i.loading!=='lazy').map(i=>i.src),
              changed,controls:controls.length};
            });
            console.log(JSON.stringify({width,name,...result,errors}));
            if(!result.heading || result.nav!==1 || result.overflow>1 || result.badImages.length || result.changed!==result.controls || errors.length) failed++;
           }
          }
          for(const name of (await readdir('pll/chapters')).filter(x=>x.endsWith('.html'))){
           const html=await readFile('pll/chapters/'+name,'utf8');
           const ids=[...html.matchAll(/<(?:section|article|div)\b[^>]*\bid="(p[1-8])"/g)].map(m=>m[1]);
           if(!ids.includes('p8')){console.log(JSON.stringify({legacy:name,skip:true}));continue;}
           errors=[];
           const url=pathToFileURL(process.cwd()+'/pll/chapters/'+name).href+'#p8';
           await load('Page.navigate',{url});
           await load('Page.reload',{ignoreCache:true});
           const visible=await evaluate(()=>!!document.getElementById('p8')?.getClientRects().length);
           console.log(JSON.stringify({legacy:name,visible,errors}));
          }
          await browser.close();
          if(failed) process.exitCode=1;
          EOF
          node "$RUNNER_TEMP/pll-browser.mjs" | tee "$RUNNER_TEMP/pll-browser-results.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pll-browser-regression
          path: |
            ${{ runner.temp }}/pll-browser-results.jsonl
